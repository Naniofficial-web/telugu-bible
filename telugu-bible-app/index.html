<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>తెలుగు బైబిల్ రీడర్</title>
<script src="node_modules/jszip/dist/jszip.min.js"></script>
<style>
:root{--bg:#f3f5f8;--fg:#121b27;--mut:#5d6b7c;--card:#fff;--line:#d6dde6;--acc:#0e6b6f;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--fg:#e6edf3;--mut:#93a3b5;--card:#16202b;--line:#2a3846;--acc:#5fc2c0;--on:#06201f}}
:root[data-theme="dark"]{--bg:#0d141c;--fg:#e6edf3;--mut:#93a3b5;--card:#16202b;--line:#2a3846;--acc:#5fc2c0;--on:#06201f}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Telugu","Nirmala UI",Gautami,system-ui,sans-serif;line-height:1.6}
.w{max-width:680px;margin:0 auto;padding:14px 14px 48px}
h1{font-size:1.25rem;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select,button,input[type=text]{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.p{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
#ver,#bk{flex:1;min-width:0}
#nm{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:10px 0 18px}
.grid button{padding:6px 0}
.grid .on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
#t{font-family:"Noto Serif Telugu","Nirmala UI",Gautami,serif;font-size:var(--fs,18px);line-height:1.95;max-width:62ch}
.v{margin:0 0 .5em}
.v b{font-family:"Noto Sans Telugu",system-ui,sans-serif;font-size:.62em;color:var(--acc);margin-right:.4em;vertical-align:super}
.note{color:var(--mut);font-size:.82rem}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:16px}
.empty ol{padding-left:1.2em;margin:.5em 0 0}
</style>
</head>
<body>
<div class="w">
<h1>📖 తెలుగు బైబిల్</h1>
<div class="bar">
<select id="ver" aria-label="Version"></select>
<button id="fm" aria-label="చిన్నగా">A−</button><button id="fp" aria-label="పెద్దగా">A+</button>
<button id="del" aria-label="Version తొలగించు">🗑</button>
</div>
<div class="bar">
<input type="text" id="nm" placeholder="Version పేరు (ఉదా: OTSA)">
<button class="p" id="dl">⬇ Download</button><button id="imp">＋ Import</button>
<input type="file" id="fi" accept=".zip,.usfm,.sfm" multiple hidden>
</div>
<div id="msg" class="note" role="status"></div>
<div id="main"></div>
<p class="note">ప్రతి version హక్కులు దాని ప్రచురణకర్తలవి. ఈ app వ్యక్తిగత వినియోగం కోసం; హక్కుల వివరాలు ebible.org లోని ఆ version పేజీలో చూడండి.</p>
</div>
<script>
const ORDER="GEN EXO LEV NUM DEU JOS JDG RUT 1SA 2SA 1KI 2KI 1CH 2CH EZR NEH EST JOB PSA PRO ECC SNG ISA JER LAM EZK DAN HOS JOL AMO OBA JON MIC NAM HAB ZEP HAG ZEC MAL MAT MRK LUK JHN ACT ROM 1CO 2CO GAL EPH PHP COL 1TH 2TH 1TI 2TI TIT PHM HEB JAS 1PE 2PE 1JN 2JN 3JN JUD REV".split(" ");
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let db=null,mem={},S={v:null,code:null,c:0},fs=+ls.get("fs")||18,ask=0;
const msg=s=>$("msg").textContent=s;

const openDB=()=>new Promise(r=>{try{const q=indexedDB.open("tb",1);q.onupgradeneeded=()=>q.result.createObjectStore("v",{keyPath:"id"});q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const tx=(m,f)=>new Promise(r=>{if(!db)return r(null);try{const t=db.transaction("v",m),q=f(t.objectStore("v"));t.oncomplete=()=>r(q.result);t.onerror=t.onabort=()=>r(null)}catch(e){r(null)}});

function parseBook(t){
 t=t.replace(/\r/g,"");
 const code=((t.match(/\\id\s+(\w{3})/)||[])[1]||"").toUpperCase();
 if(!ORDER.includes(code))return null;
 const name=((t.match(/\\h\s+(.+)/)||t.match(/\\toc2\s+(.+)/)||t.match(/\\toc1\s+(.+)/)||[])[1]||code).trim();
 t=t.replace(/\\(f|x)\s[\s\S]*?\\\1\*/g,"");
 const p=t.split(/\\c\s+(\d+)/),ch=[];
 for(let i=1;i<p.length;i+=2){
  const q=p[i+1].split(/\\v\s+(\d+)\S*\s*/),vs=[];
  for(let j=1;j<q.length;j+=2){
   const x=q[j+1].split("\n").filter(l=>!/^\s*\\(s\d?|ms\d?|mr|r|d|sp|qa|cl|cp|b|mt\d?|ip\d?|is\d?|iot|io\d?)(\s|$)/.test(l)).join(" ").replace(/\\[+\w]+\*?/g,"").replace(/\s+/g," ").trim();
   if(x)vs.push([+q[j],x]);
  }
  ch[+p[i]-1]=vs;
 }
 return {code,name,ch};
}

async function doImport(files){
 try{
  msg("Import అవుతోంది…");
  const texts=[];
  for(const f of files){
   if(/\.zip$/i.test(f.name)){
    const z=await JSZip.loadAsync(f);
    for(const e of Object.values(z.files))if(!e.dir&&/\.(usfm|sfm)$/i.test(e.name))texts.push(await e.async("string"));
   }else texts.push(await f.text());
  }
  const books=texts.map(parseBook).filter(Boolean).sort((a,b)=>ORDER.indexOf(a.code)-ORDER.indexOf(b.code));
  if(!books.length){msg("USFM books దొరకలేదు. ebible.org నుండి USFM zip తీసుకోండి.");return}
  const id="v"+Date.now(),v={id,name:$("nm").value.trim()||files[0].name.replace(/\.\w+$/,""),books};
  mem[id]=v;$("nm").value="";
  const ok=await tx("readwrite",s=>s.put(v));
  S.v=id;fill();show();
  msg(books.length+" books import అయ్యాయి."+(db&&ok!==null?" Offline లో కూడా చదవొచ్చు.":" ఈ browser లో save కాలేదు, page మూసేస్తే మళ్ళీ import చేయాలి."));
 }catch(e){msg("Import కాలేదు: "+(e&&e.message||e))}
}

function fill(){
 $("ver").innerHTML=Object.values(mem).map(v=>`<option value="${v.id}"${v.id===S.v?" selected":""}>${esc(v.name)}</option>`).join("");
}

function show(){
 const v=mem[S.v],m=$("main");
 if(!v){m.innerHTML=`<div class="empty"><b>Versions download అవుతున్నాయి…</b><br>Internet కావాలి. ఒక్కసారి అయ్యాక offline లో చదవొచ్చు. రాకపోతే పైన ⬇ నొక్కండి.</div>`;return}
 let bi=v.books.findIndex(b=>b.code===S.code);if(bi<0)bi=0;
 const bk=v.books[bi];S.code=bk.code;
 if(!bk.ch[S.c])S.c=Math.max(0,bk.ch.findIndex(Boolean));
 m.innerHTML=`<div class="bar"><select id="bk" aria-label="Book">${v.books.map(b=>`<option value="${b.code}"${b.code===S.code?" selected":""}>${esc(b.name)}</option>`).join("")}</select></div>
<div class="grid">${bk.ch.map((x,i)=>x?`<button data-c="${i}"${i===S.c?' class="on"':""}>${i+1}</button>`:"").join("")}</div>
<div id="t">${(bk.ch[S.c]||[]).map(([n,t])=>`<p class="v"><b>${n}</b>${esc(t)}</p>`).join("")}</div>
<div class="bar"><button id="pv">← ముందు</button><button id="nx" class="p">తర్వాత →</button></div>`;
 $("bk").onchange=e=>{S.code=e.target.value;S.c=0;show();scrollTo(0,0)};
 m.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.c=+b.dataset.c;show();scrollTo(0,0)});
 $("pv").onclick=()=>step(-1);$("nx").onclick=()=>step(1);
 ls.set("tb",JSON.stringify({v:S.v,code:S.code,c:S.c}));
}

function step(d){
 const v=mem[S.v];let b=v.books.findIndex(x=>x.code===S.code);
 if(v.books[b].ch[S.c+d])S.c+=d;
 else{b+=d;if(!v.books[b])return;const ch=v.books[b].ch;S.code=v.books[b].code;S.c=d>0?ch.findIndex(Boolean):ch.length-1}
 show();scrollTo(0,0);
}

function setfs(d){fs=Math.min(34,Math.max(14,fs+d));document.documentElement.style.setProperty("--fs",fs+"px");ls.set("fs",fs)}

async function dl(u){
 if(window.api)return api.dl(u);
 const r=await Capacitor.Plugins.CapacitorHttp.request({url:u,method:"GET",responseType:"blob"});
 if(r.status!==200)throw new Error("HTTP "+r.status);
 const t=atob(r.data),a=new Uint8Array(t.length);
 for(let i=0;i<t.length;i++)a[i]=t.charCodeAt(i);
 return a;
}
const PRE=[["telotsa","Biblica OTSA"],["tel2017","IRV 2019"],["tel2010","Easy-to-Read (ERV)"]];
async function getAll(){
 for(const [id,nm] of PRE){
  if(Object.values(mem).some(v=>v.name===nm))continue;
  try{msg(nm+" download అవుతోంది…");$("nm").value=nm;
   await doImport([new File([await dl("https://ebible.org/Scriptures/"+id+"_usfm.zip")],id+".zip")]);
  }catch(e){msg(nm+" రాలేదు: "+(e&&e.message||e))}
 }
}
$("dl").onclick=getAll;
$("imp").onclick=()=>$("fi").click();
$("fi").onchange=e=>{const f=[...e.target.files];e.target.value="";if(f.length)doImport(f)};
$("ver").onchange=e=>{S.v=e.target.value;show()};
$("fm").onclick=()=>setfs(-2);$("fp").onclick=()=>setfs(2);
$("del").onclick=async()=>{
 if(!S.v)return;
 if(!ask){ask=1;$("del").textContent="ఖచ్చితంగా?";setTimeout(()=>{ask=0;$("del").textContent="🗑"},3000);return}
 ask=0;$("del").textContent="🗑";
 const id=S.v;delete mem[id];await tx("readwrite",s=>s.delete(id));
 S.v=Object.keys(mem)[0]||null;fill();show();
};

(async()=>{
 setfs(0);
 db=await openDB();
 ((await tx("readonly",s=>s.getAll()))||[]).forEach(v=>mem[v.id]=v);
 try{const s=JSON.parse(ls.get("tb")||"{}");if(mem[s.v]){S.v=s.v;S.code=s.code;S.c=s.c||0}}catch(e){}
 if(!S.v)S.v=Object.keys(mem)[0]||null;
 fill();show();
 if(!Object.keys(mem).length)getAll();
})();
</script>
</body>
</html>
